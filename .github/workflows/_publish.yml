name: Publish Images

# Pushes the images built and smoke tested by a CI run to the configured registries.
#
# The image archives are treated as data: they are pushed with skopeo (digests preserved) and never loaded or run.
# Callers must only pass run IDs of CI runs they have decided to publish.
#
# define in GH Repository -> Actions -> Variables (or act .variables) to enable pushing to registries
# -- will only push to registries that are defined
# EX
# DOCKERHUB_SLUG=foxxmd/multi-scrobbler
# GHCR_SLUG=ghcr.io/foxxmd/multi-scrobbler
#
# Callers need to grant: contents: read, packages: write, actions: read (download artifacts from run-id)
# and pull-requests: write (only used when pr-number is set)

on:
  workflow_call:
    inputs:
      run-id:
        description: "ID of the CI run whose image artifacts should be published"
        required: true
        type: string
      pr-number:
        description: "If set, publish only as pr-<number> and comment on the PR"
        required: false
        type: string
        default: ''
      sha:
        description: "Commit the images were built from, used in the PR comment"
        required: false
        type: string
        default: ''
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

jobs:
  publish:
    name: Push and Merge Images
    # pinned: relies on skopeo being preinstalled in this runner image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # download exact artifact names so an extra artifact in the run can't be published
      - name: Download amd64 image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #8.0.1
        with:
          name: images-linux-amd64
          path: /tmp/images/amd64
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      - name: Download arm64 image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #8.0.1
        with:
          name: images-linux-arm64
          path: /tmp/images/arm64
          run-id: ${{ inputs.run-id }}
          github-token: ${{ github.token }}

      # the archives are untrusted data: check they contain exactly what build produces before pushing anything
      - name: Verify images
        run: |
          for arch in amd64 arm64; do
            dir="/tmp/images/$arch"
            files=$(find "$dir" -type f -printf '%P\n' | sort | tr '\n' ' ')
            if [[ "$files" != "app-debug.tar app.tar " ]]; then
              echo "::error::Artifact images-linux-$arch must contain only app.tar and app-debug.tar, found: $files"
              exit 1
            fi
            for variant in app app-debug; do
              archive="$dir/$variant.tar"
              index=$(tar -xOf "$archive" index.json)
              if [[ "$(jq '.manifests | length' <<< "$index")" != "1" ]]; then
                echo "::error::$arch $variant archive must contain exactly one manifest"
                exit 1
              fi
              media_type=$(jq -r '.manifests[0].mediaType' <<< "$index")
              case "$media_type" in
                application/vnd.docker.distribution.manifest.v2+json|application/vnd.oci.image.manifest.v1+json) ;;
                *) echo "::error::$arch $variant archive has unexpected manifest type $media_type"; exit 1;;
              esac
              digest=$(jq -er '.manifests[0].digest' <<< "$index")
              config_digest=$(tar -xOf "$archive" "blobs/sha256/${digest#sha256:}" | jq -er '.config.digest')
              platform=$(tar -xOf "$archive" "blobs/sha256/${config_digest#sha256:}" | jq -r '.os + "/" + .architecture')
              if [[ "$platform" != "linux/$arch" ]]; then
                echo "::error::images-linux-$arch $variant.tar contains a $platform image"
                exit 1
              fi
              echo "$arch $variant: $digest ($media_type)"
            done
          done

      - name: Login to Docker Hub
        if: ${{ vars.DOCKERHUB_SLUG != '' }}
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        if: ${{ vars.GHCR_SLUG != '' }}
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # each archive holds one single-platform image, push it untagged by its digest
      # skopeo is preinstalled on ubuntu runners and reads the credentials docker/login-action wrote
      - name: Push images by digest
        env:
          VARS_DOCKERHUB_SLUG: ${{ vars.DOCKERHUB_SLUG }}
          VARS_GHCR_SLUG: ${{ vars.GHCR_SLUG }}
        run: |
          slugs=()
          [[ -n "$VARS_DOCKERHUB_SLUG" ]] && slugs+=("$VARS_DOCKERHUB_SLUG")
          [[ -n "$VARS_GHCR_SLUG" ]] && slugs+=("$VARS_GHCR_SLUG")
          for variant in app app-debug; do
            mkdir -p "/tmp/digests/$variant"
            for arch in amd64 arm64; do
              archive="/tmp/images/$arch/$variant.tar"
              digest=$(tar -xOf "$archive" index.json | jq -er '.manifests[0].digest')
              for slug in "${slugs[@]}"; do
                echo "Pushing $archive to $slug@$digest"
                skopeo copy --retry-times 3 --preserve-digests --dest-authfile "$HOME/.docker/config.json" \
                  "oci-archive:$archive" "docker://$slug@$digest"
              done
              touch "/tmp/digests/$variant/${digest#sha256:}"
            done
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 #v3.11.1

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf #6.0.0
        with:
          images: |
            ${{ vars.DOCKERHUB_SLUG }}
            ${{ vars.GHCR_SLUG }}
          # generate Docker tags based on the following events/attributes
          # https://github.com/docker/metadata-action/issues/247#issuecomment-1511259674 for NOT is default branch, eventually
          tags: |
            # PR images are only tagged with their PR number
            type=raw,value=pr-${{ inputs.pr-number }},enable=${{ inputs.pr-number != '' }}

            type=edge,enable=${{ inputs.pr-number == '' }}

            # push with branch name as tag if not master/main
            type=ref,event=branch,enable=${{ inputs.pr-number == '' && !endsWith(github.ref, 'master') }}

            # tag non-prelease as latest -- has a higher priority than regular tag so it shows first in registries
            type=match,pattern=\d.\d.\d$,priority=901,enable=${{ inputs.pr-number == '' }}

            # tag all semver (include pre-release)
            type=semver,pattern={{version}},enable=${{ inputs.pr-number == '' }}
          flavor: |
            latest=${{ inputs.pr-number != '' && 'false' || 'auto' }}
          labels: |
            org.opencontainers.image.title=Multi-Scrobbler
            org.opencontainers.image.description=Scrobble from many sources to many clients
            org.opencontainers.image.vendor=FoxxMD

      # the debug variant gets the same tags with a -debug suffix, EX edge-debug, 1.2.3-debug, latest-debug, pr-12-debug
      - name: Create manifest lists and push
        env:
          VARS_DOCKERHUB_SLUG: ${{ vars.DOCKERHUB_SLUG }}
          VARS_GHCR_SLUG: ${{ vars.GHCR_SLUG }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for slug in "$VARS_DOCKERHUB_SLUG" "$VARS_GHCR_SLUG"; do
            if [[ -z "$slug" ]]; then
              continue
            fi
            for variant in app app-debug; do
              suffix=""
              if [[ "$variant" == "app-debug" ]]; then
                suffix="-debug"
              fi
              mapfile -t tag_args < <(jq -r --arg slug "$slug" --arg suffix "$suffix" \
                '.tags[] | select(startswith($slug + ":")) | "-t", (. + $suffix)' <<< "$DOCKER_METADATA_OUTPUT_JSON")
              mapfile -t sources < <(find "/tmp/digests/$variant" -type f -printf "$slug@sha256:%f\n")
              docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
              docker buildx imagetools inspect "$slug:$VERSION$suffix"
            done
          done

      - name: List PR images
        id: pr-images
        if: ${{ inputs.pr-number != '' }}
        env:
          VARS_DOCKERHUB_SLUG: ${{ vars.DOCKERHUB_SLUG }}
          VARS_GHCR_SLUG: ${{ vars.GHCR_SLUG }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          {
            echo "list<<EOF"
            for slug in "$VARS_DOCKERHUB_SLUG" "$VARS_GHCR_SLUG"; do
              if [[ -n "$slug" ]]; then
                echo "* \`$slug:pr-$PR_NUMBER\` (debug variant with shell and curl: \`$slug:pr-$PR_NUMBER-debug\`)"
              fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: ${{ inputs.pr-number != '' }}
        uses: marocchino/sticky-pull-request-comment@d4d6b0936434b21bc8345ad45a440c5f7d2c40ff #3.0.3
        with:
          number: ${{ inputs.pr-number }}
          recreate: true
          header: "pr-release"
          message: |
            #### :package: A new release has been made for this pull request.

            To play around with this PR, pull an image:
            ${{ steps.pr-images.outputs.list }}

            Images are available for x86_64 and ARM64.

            > Latest commit: ${{ inputs.sha }}
